buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 8+ requires namespace. For legacy plugins that only define package
// in AndroidManifest.xml, infer namespace automatically.
subprojects { subproject ->
    def assignNamespaceFromManifest = {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt == null) {
            return
        }

        def hasNamespaceProp = androidExt.hasProperty("namespace")
        def currentNamespace = hasNamespaceProp ? androidExt.namespace : null
        if (currentNamespace != null && currentNamespace.toString().trim()) {
            return
        }

        def manifestFile = subproject.file("src/main/AndroidManifest.xml")
        if (!manifestFile.exists()) {
            return
        }

        def manifest = new XmlSlurper(false, false).parse(manifestFile)
        def manifestPackage = manifest.@package?.text()
        if (manifestPackage != null && manifestPackage.trim()) {
            androidExt.namespace = manifestPackage.trim()
        }
    }

    subproject.plugins.withId("com.android.library") {
        assignNamespaceFromManifest()
    }
    subproject.plugins.withId("com.android.application") {
        assignNamespaceFromManifest()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
